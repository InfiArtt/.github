name: Feature request
description: Suggest an idea or a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A clear description of the problem or need, for example "It takes too many steps to ...".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways of solving this, or workarounds you use today.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Any other context, examples or links.
    validations:
      required: false
