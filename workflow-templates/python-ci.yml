# InfiArtt Python CI: checks every push to the main branch and every pull request.
name: Python CI

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # Change to the version your project uses.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e ".[dev]" || pip install -e .
          fi

      - name: Check that every file compiles
        run: python -m compileall -q .

      - name: Run the tests
        run: |
          if [ -d tests ] || [ -d test ]; then
            pip install pytest
            # Exit code 5 means no tests were found yet, which is not a failure.
            pytest || [ $? -eq 5 ]
          else
            echo "No tests folder yet. Add tests/ and they will run here."
          fi
