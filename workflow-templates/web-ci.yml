# InfiArtt Web CI: installs, lints, builds and tests a Node.js project
# (Astro, React, Vite, ...) on every push to the main branch and every pull request.
name: Web CI

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      # Each step runs only if package.json defines that script.
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
